{% extends "base.html" %}
{% block title %}Connexion — Climbing Planner{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Connexion</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></label>
    <label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label>
    <button>Se connecter</button>
  </form>
  <p><a href="/forgot">Mot de passe oublié ?</a></p>
  <p class="muted">Votre club n'utilise pas encore Climbing Planner ? <a href="/creer-un-club">Demandez sa création</a>.</p>
  <p class="muted">Les comptes sont créés par l'administrateur de votre club.</p>
</section>
{% endblock %}
