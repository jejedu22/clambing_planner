{% extends "base.html" %}
{% block title %}Mot de passe — Climbing Planner{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Changer mon mot de passe</h1>
  {% if user.must_change_password %}<p class="muted">Vous devez choisir un nouveau mot de passe avant de continuer.</p>{% endif %}
  <form method="post" action="/password">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Mot de passe actuel <input type="password" name="current" required autocomplete="current-password"></label>
    <label>Nouveau mot de passe (10 caractères minimum) <input type="password" name="new" required minlength="10" autocomplete="new-password"></label>
    <label>Confirmation <input type="password" name="confirm" required minlength="10" autocomplete="new-password"></label>
    <button>Enregistrer</button>
  </form>
</section>
{% endblock %}
