services:
  app:
    build: .
    container_name: climbing-app
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://climbing:${POSTGRES_PASSWORD:?}@db:5432/climbing
      SECRET_KEY: ${SECRET_KEY:?}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      SITES_REFRESH_DAYS: ${SITES_REFRESH_DAYS:-30}
      # Base des liens dans les emails (mot de passe oublié, invitations, notifications)
      APP_BASE_URL: https://${APP_HOST:?}
      # Mot de passe oublié : envoi SMTP classique
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Climbing Planner}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      # Journalisation
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"   # rotation : 5 x 10 Mo par conteneur
        max-file: "5"
    networks:
      - proxy      # exposé via Traefik
      - internal   # accès à la base
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.climbing.rule=Host(`${APP_HOST:?}`)
      - traefik.http.routers.climbing.entrypoints=websecure
      - traefik.http.routers.climbing.tls.certresolver=letsencrypt
      - traefik.http.routers.climbing.middlewares=default@file
      - traefik.http.services.climbing.loadbalancer.server.port=8000

  db:
    image: postgres:16-alpine
    container_name: climbing-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: climbing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: climbing
    logging: *logging
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climbing -d climbing"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal   # jamais exposé, ni sur le réseau proxy ni sur l'hôte

volumes:
  pgdata:

networks:
  proxy:
    external: true
  internal:
    internal: true
